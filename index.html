<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Signs of student life</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<a class="site-title" href="#top" aria-label="Signs of student life home">Signs of student life</a>
		<button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-theme-toggle>
			<span aria-hidden="true">&#9788;</span>
			<span class="theme-toggle__label">Light mode</span>
		</button>
	</header>

	<main id="top">
		<section class="gallery-section" aria-labelledby="workspaces-heading">
			<div class="section-heading">
				<p class="section-number">01</p>
				<h1 id="workspaces-heading">Workspaces</h1>
			</div>
			<div class="workspace-grid">
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Window desk">
						<img src="images/window-desk.jpg" alt="A desk beside a bright window" loading="lazy">
					</button>
					<figcaption>Window desk</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Logic proofs">
						<img src="images/logic-proofs.jpg" alt="Handwritten logic proofs on a desk" loading="lazy">
					</button>
					<figcaption>Logic proofs</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Corner desk">
						<img src="images/corner-desk.jpg" alt="A compact corner desk with an open notebook" loading="lazy">
					</button>
					<figcaption>Corner desk</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Textbook bookcase">
						<img src="images/textbook-bookcase.jpg" alt="A bookcase filled with textbooks" loading="lazy">
					</button>
					<figcaption>Textbook bookcase</figcaption>
				</figure>
			</div>
		</section>

		<section class="gallery-section" aria-labelledby="artifacts-heading">
			<div class="section-heading">
				<p class="section-number">02</p>
				<h2 id="artifacts-heading">Artifacts</h2>
			</div>
			<div class="artifacts-grid">
				<figure class="photo-card photo-card--tall">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Everyday backpack">
						<img src="images/backpack.jpg" alt="A canvas backpack resting on a chair" loading="lazy">
					</button>
					<figcaption>Everyday backpack</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Pasta lunch">
						<img src="images/pasta-lunch.jpg" alt="A bowl of pasta prepared for lunch" loading="lazy">
					</button>
					<figcaption>Pasta lunch</figcaption>
				</figure>
				<figure class="photo-card photo-card--tall">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Pink flask">
						<img src="images/pink-flask.jpg" alt="A pink flask beside a notebook" loading="lazy">
					</button>
					<figcaption>Pink flask</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Shoes in the hallway">
						<img src="images/shoes-hallway.jpg" alt="Shoes lined up in a hallway" loading="lazy">
					</button>
					<figcaption>Shoes in the hallway</figcaption>
				</figure>
				<figure class="photo-card photo-card--wide">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Water bottle and notes">
						<img src="images/water-bottle-notes.jpg" alt="A water bottle beside study notes" loading="lazy">
					</button>
					<figcaption>Water bottle and notes</figcaption>
				</figure>
			</div>
		</section>

		<section class="gallery-section" aria-labelledby="environments-heading">
			<div class="section-heading">
				<p class="section-number">03</p>
				<h2 id="environments-heading">Shared Environments</h2>
			</div>
			<div class="environment-grid">
				<figure class="photo-card photo-card--feature">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Music setup">
						<img src="images/music-setup.jpg" alt="A small music setup with headphones and speakers" loading="lazy">
					</button>
					<figcaption>Music setup</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Cafeteria tray">
						<img src="images/cafeteria-tray.jpg" alt="A meal arranged on a cafeteria tray" loading="lazy">
					</button>
					<figcaption>Cafeteria tray</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Hallway view">
						<img src="images/hallway-view.jpg" alt="A long interior hallway seen from a doorway" loading="lazy">
					</button>
					<figcaption>Hallway view</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Plastic chairs">
						<img src="images/plastic-chairs.jpg" alt="Rows of colorful plastic chairs" loading="lazy">
					</button>
					<figcaption>Plastic chairs</figcaption>
				</figure>
				<figure class="photo-card photo-card--feature">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Wall clippings">
						<img src="images/wall-clippings.jpg" alt="A wall layered with paper clippings" loading="lazy">
					</button>
					<figcaption>Wall clippings</figcaption>
				</figure>
			</div>
		</section>
	</main>

	<div class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden data-lightbox-dialog>
		<div class="lightbox__backdrop" data-lightbox-close></div>
		<div class="lightbox__content">
			<button class="lightbox__close" type="button" aria-label="Close image viewer" data-lightbox-close>&times;</button>
			<img class="lightbox__image" src="" alt="" data-lightbox-image>
			<p class="lightbox__caption" id="lightbox-title" data-lightbox-title></p>
		</div>
	</div>

	<footer class="site-footer">
		<p>&copy; 2026 Signs of student life</p>
	</footer>

	<script src="script.js"></script>
</body>
</html>
