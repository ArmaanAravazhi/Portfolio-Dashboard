<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Signs of student life</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<a class="site-title" href="#top" aria-label="Signs of student life home">Signs of student life</a>
		<button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-theme-toggle>
			<span aria-hidden="true">&#9788;</span>
			<span class="theme-toggle__label">Light mode</span>
		</button>
	</header>

	<main id="top">
		<section class="gallery-section" aria-labelledby="workspaces-heading">
			<div class="section-heading">
				<p class="section-number">01</p>
				<h1 id="workspaces-heading">Workspaces</h1>
			</div>
			<div class="workspace-grid">
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Window desk">
						<img src="images/Window Desk.jpeg" alt="A study desk with notebooks and papers facing a multi-pane window" loading="lazy">
					</button>
					<figcaption>Window desk</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Logic proofs">
						<img src="images/Logic Proofs.jpeg" alt="Laptop displaying code beside an open notebook with handwritten logic proofs" loading="lazy">
					</button>
					<figcaption>Logic proofs</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Corner desk">
						<img src="images/Corner Desk.jpeg" alt="Compact corner study desk with a laptop, mouse, and backpack on the chair" loading="lazy">
					</button>
					<figcaption>Corner desk</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Textbook bookcase">
						<img src="images/Textbook Bookcase.jpeg" alt="Bookcase tightly packed with engineering and science textbooks" loading="lazy">
					</button>
					<figcaption>Textbook bookcase</figcaption>
				</figure>
			</div>
		</section>

		<section class="gallery-section" aria-labelledby="artifacts-heading">
			<div class="section-heading">
				<p class="section-number">02</p>
				<h2 id="artifacts-heading">Artifacts</h2>
			</div>
			<div class="artifacts-grid">
				<figure class="photo-card photo-card--tall">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Open locker">
						<img src="images/Open Locker.jpeg" alt="Open metal locker containing stacked engineering textbooks and spiral notebooks" loading="lazy">
					</button>
					<figcaption>Open locker</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Everyday backpack">
						<img src="images/Everyday Backpack.jpeg" alt="Open wooden cubby shelves filled with various student backpacks" loading="lazy">
					</button>
					<figcaption>Everyday backpack</figcaption>
				</figure>
				<figure class="photo-card photo-card--tall">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Pasta lunch">
						<img src="images/Pasta Lunch.jpeg" alt="Tiffin container of penne pasta with a jute bag on a dining table" loading="lazy">
					</button>
					<figcaption>Pasta lunch</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Pink flask">
						<img src="images/Pink Flask.jpeg" alt="Outdoor balcony table with laptops, backpack, and a pink flask" loading="lazy">
					</button>
					<figcaption>Pink flask</figcaption>
				</figure>
				<figure class="photo-card photo-card--wide">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Shoes in the hallway">
						<img src="images/Shoes in the Hallway.jpeg" alt="Footwear lined up outside dorm room doors along a long green hallway" loading="lazy">
					</button>
					<figcaption>Shoes in the hallway</figcaption>
				</figure>
			</div>
		</section>

		<section class="gallery-section" aria-labelledby="environments-heading">
			<div class="section-heading">
				<p class="section-number">03</p>
				<h2 id="environments-heading">Shared Environments</h2>
			</div>
			<div class="environment-grid">
				<figure class="photo-card photo-card--feature">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Music setup">
						<img src="images/Music Setup.jpeg" alt="Music room with drum set, electronic keyboards, instruments, and plastic stools" loading="lazy">
					</button>
					<figcaption>Music setup</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Cafeteria tray">
						<img src="images/Cafeteria Tray.jpeg" alt="Cafeteria table with food trays, soda can, and newspaper clippings on the wall" loading="lazy">
					</button>
					<figcaption>Cafeteria tray</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Notice board">
						<img src="images/Notice Board.jpeg" alt="Glass bulletin board filled with student notices, posters, and club flyers" loading="lazy">
					</button>
					<figcaption>Notice board</figcaption>
				</figure>
				<figure class="photo-card">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Design workshop poster">
						<img src="images/Design Workshop Poster.jpeg" alt="Framed poster announcing a 3-day Canva design workshop" loading="lazy">
					</button>
					<figcaption>Design workshop poster</figcaption>
				</figure>
				<figure class="photo-card photo-card--feature">
					<button class="photo-card__trigger" type="button" data-lightbox="true" data-title="Laundry room">
						<img src="images/Laundry Room.jpeg" alt="Piles of sorted laundry clothes and detergent bottle on a table in front of washing machines" loading="lazy">
					</button>
					<figcaption>Laundry room</figcaption>
				</figure>
			</div>
		</section>
	</main>

	<div class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden data-lightbox-dialog>
		<div class="lightbox__backdrop" data-lightbox-close></div>
		<div class="lightbox__content">
			<button class="lightbox__close" type="button" aria-label="Close image viewer" data-lightbox-close>&times;</button>
			<img class="lightbox__image" src="" alt="" data-lightbox-image>
			<p class="lightbox__caption" id="lightbox-title" data-lightbox-title></p>
		</div>
	</div>

	<footer class="site-footer">
		<p>&copy; 2026 Signs of student life</p>
	</footer>

	<script src="script.js"></script>
</body>
</html>
